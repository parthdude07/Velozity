services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: velozity
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: velozity_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/velozity?schema=public
      PORT: 5000
      NODE_ENV: development
      JWT_ACCESS_SECRET: dev_access_secret_at_least_32_characters_long_abc
      JWT_REFRESH_SECRET: dev_refresh_secret_at_least_32_characters_long_xyz
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    volumes:
      - ./apps/api/src:/app/src

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    container_name: velozity_web
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  postgres_data:
